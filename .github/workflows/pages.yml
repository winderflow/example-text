name: Validate gallery (Pages optional)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: 'Publish website (enable Settings > Pages > GitHub Actions first)'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/collect_web_images.py --self-test
      - run: node --check app.js
      - run: python scripts/build_site.py
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
        with:
          path: dist
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy gallery
        id: deployment
        uses: actions/deploy-pages@v4
